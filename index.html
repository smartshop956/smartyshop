
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Deals - Live Chat</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#f3f6fb;
      min-height:100vh;
    }

    .header{
      background:#1769e0;
      color:white;
      padding:18px;
      text-align:center;
      box-shadow:0 2px 8px rgba(0,0,0,.15);
    }

    .header h1{
      font-size:24px;
    }

    .header p{
      margin-top:5px;
      font-size:13px;
      opacity:.9;
    }

    .container{
      width:100%;
      max-width:600px;
      margin:25px auto;
      padding:0 15px;
    }

    .card{
      background:white;
      border-radius:15px;
      padding:20px;
      box-shadow:0 4px 18px rgba(0,0,0,.08);
    }

    .card h2{
      text-align:center;
      margin-bottom:8px;
      color:#222;
    }

    .subtitle{
      text-align:center;
      color:#777;
      font-size:14px;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:14px;
      margin-bottom:12px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:15px;
      outline:none;
    }

    input:focus{
      border-color:#1769e0;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:#1769e0;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    button:disabled{
      background:#aaa;
    }

    #loginBox{
      display:block;
    }

    #chatBox{
      display:none;
    }

    .chat-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding-bottom:12px;
      border-bottom:1px solid #eee;
      margin-bottom:10px;
    }

    .online{
      color:#16a34a;
      font-size:13px;
      font-weight:bold;
    }

    #messages{
      height:430px;
      overflow-y:auto;
      padding:10px 2px;
      background:#f7f9fc;
      border-radius:10px;
    }

    .message{
      max-width:80%;
      padding:10px 13px;
      margin:7px 0;
      border-radius:12px;
      word-wrap:break-word;
      font-size:14px;
      line-height:1.4;
    }

    .customer{
      margin-left:auto;
      background:#1769e0;
      color:white;
      border-bottom-right-radius:3px;
    }

    .admin{
      margin-right:auto;
      background:#e9edf3;
      color:#222;
      border-bottom-left-radius:3px;
    }

    .time{
      display:block;
      font-size:10px;
      opacity:.7;
      margin-top:4px;
      text-align:right;
    }

    .send-area{
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    .send-area input{
      margin:0;
      flex:1;
    }

    .send-area button{
      width:90px;
      padding:10px;
    }

    .status{
      text-align:center;
      font-size:13px;
      margin-top:10px;
      color:#777;
    }

    .error{
      color:#dc2626;
    }

    .success{
      color:#16a34a;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Smart Deals</h1>
    <p>Customer Support Live Chat</p>
  </div>

  <div class="container">

    <!-- CUSTOMER DETAILS -->
    <div class="card" id="loginBox">
      <h2>💬 Live Chat</h2>
      <p class="subtitle">
        हमारी support team से बात करने के लिए अपनी जानकारी भरें।
      </p>

      <input
        type="text"
        id="name"
        placeholder="आपका नाम"
        autocomplete="name"
      >

      <input
        type="tel"
        id="phone"
        placeholder="मोबाइल नंबर"
        autocomplete="tel"
      >

      <input
        type="email"
        id="email"
        placeholder="ईमेल (Optional)"
        autocomplete="email"
      >

      <button id="startBtn">
        Chat शुरू करें
      </button>

      <div class="status" id="loginStatus"></div>
    </div>


    <!-- CHAT -->
    <div class="card" id="chatBox">

      <div class="chat-header">
        <div>
          <b>Smart Deals Support</b>
        </div>

        <div class="online">
          ● Online
        </div>
      </div>

      <div id="messages">
        <div class="status">
          Messages load हो रहे हैं...
        </div>
      </div>

      <div class="send-area">
        <input
          type="text"
          id="messageInput"
          placeholder="अपना message लिखें..."
          autocomplete="off"
        >

        <button id="sendBtn">
          Send
        </button>
      </div>

      <div class="status" id="chatStatus"></div>

    </div>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      doc,
      setDoc,
      query,
      orderBy,
      onSnapshot,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {
      apiKey: "AIzaSyDhxguIh_oSvRF0DqKKXO3frzQV0haYeGo",
      authDomain: "smart-deals-99646.firebaseapp.com",
      projectId: "smart-deals-99646",
      storageBucket: "smart-deals-99646.firebasestorage.app",
      messagingSenderId: "778513438968",
      appId: "1:778513438968:web:ac20adc60ff63edd42830d"
    };


    /* =========================
       FIREBASE INITIALIZE
    ========================= */

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    /* =========================
       ELEMENTS
    ========================= */

    const loginBox = document.getElementById("loginBox");
    const chatBox = document.getElementById("chatBox");

    const nameInput = document.getElementById("name");
    const phoneInput = document.getElementById("phone");
    const emailInput = document.getElementById("email");

    const startBtn = document.getElementById("startBtn");
    const sendBtn = document.getElementById("sendBtn");

    const messageInput = document.getElementById("messageInput");
    const messages = document.getElementById("messages");

    const loginStatus = document.getElementById("loginStatus");
    const chatStatus = document.getElementById("chatStatus");


    /* =========================
       CURRENT CHAT
    ========================= */

    let currentChatId = null;
    let unsubscribeMessages = null;


    /* =========================
       START CHAT
    ========================= */

    startBtn.addEventListener("click", async () => {

      const name = nameInput.value.trim();
      const phone = phoneInput.value.trim();
      const email = emailInput.value.trim();

      if (!name) {
        loginStatus.textContent = "कृपया अपना नाम डालें।";
        loginStatus.className = "status error";
        return;
      }

      if (!phone) {
        loginStatus.textContent = "कृपया मोबाइल नंबर डालें।";
        loginStatus.className = "status error";
        return;
      }

      startBtn.disabled = true;
      startBtn.textContent = "Chat शुरू हो रही है...";

      loginStatus.textContent = "";


      try {

        /*
          नया chat document
        */

        const chatRef = doc(
          collection(db, "chats")
        );

        currentChatId = chatRef.id;


        /*
          Customer information save
        */

        await setDoc(chatRef, {

          name: name,
          phone: phone,
          email: email,

          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),

          status: "open",

          lastMessage: ""

        });


        /*
          Chat screen open
        */

        loginBox.style.display = "none";
        chatBox.style.display = "block";

        chatStatus.textContent =
          "आपकी chat शुरू हो गई है।";

        chatStatus.className =
          "status success";


        /*
          Messages सुनना शुरू
        */

        listenForMessages();


        messageInput.focus();

      } catch (error) {

        console.error(error);

        loginStatus.textContent =
          "Chat शुरू नहीं हो सकी। Firebase/Firestore settings check करें।";

        loginStatus.className =
          "status error";

        startBtn.disabled = false;
        startBtn.textContent = "Chat शुरू करें";
      }

    });


    /* =========================
       LISTEN FOR MESSAGES
    ========================= */

    function listenForMessages() {

      if (!currentChatId) return;


      if (unsubscribeMessages) {
        unsubscribeMessages();
      }


      const messagesRef = collection(
        db,
        "chats",
        currentChatId,
        "messages"
      );


      const messagesQuery = query(
        messagesRef,
        orderBy("createdAt", "asc")
      );


      unsubscribeMessages = onSnapshot(
        messagesQuery,
        (snapshot) => {

          messages.innerHTML = "";


          if (snapshot.empty) {

            messages.innerHTML = `
              <div class="status">
                आपका message यहाँ दिखाई देगा।
              </div>
            `;

            return;
          }


          snapshot.forEach((docSnap) => {

            const data = docSnap.data();

            const div =
              document.createElement("div");


            div.classList.add("message");


            if (data.sender === "customer") {

              div.classList.add("customer");

            } else {

              div.classList.add("admin");

            }


            const text =
              document.createElement("div");

            text.textContent =
              data.text || "";


            const time =
              document.createElement("span");

            time.className = "time";


            if (data.createdAt) {

              try {

                time.textContent =
                  data.createdAt
                    .toDate()
                    .toLocaleTimeString(
                      "hi-IN",
                      {
                        hour: "2-digit",
                        minute: "2-digit"
                      }
                    );

              } catch (e) {

                time.textContent = "";

              }

            }


            div.appendChild(text);
            div.appendChild(time);

            messages.appendChild(div);

          });


          messages.scrollTop =
            messages.scrollHeight;

        },

        (error) => {

          console.error(error);

          chatStatus.textContent =
            "Messages load नहीं हो सके।";

          chatStatus.className =
            "status error";

        }
      );

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text) return;


      if (!currentChatId) {

        chatStatus.textContent =
          "पहले chat शुरू करें।";

        chatStatus.className =
          "status error";

        return;
      }


      sendBtn.disabled = true;


      try {

        await addDoc(
          collection(
            db,
            "chats",
            currentChatId,
            "messages"
          ),
          {

            text: text,

            sender: "customer",

            createdAt: serverTimestamp()

          }
        );


        /*
          Last message update
        */

        await setDoc(
          doc(db, "chats", currentChatId),
          {
            lastMessage: text,
            updatedAt: serverTimestamp()
          },
          {
            merge: true
          }
        );


        messageInput.value = "";
        messageInput.focus();


      } catch (error) {

        console.error(error);

        chatStatus.textContent =
          "Message send नहीं हुआ।";

        chatStatus.className =
          "status error";

      }


      sendBtn.disabled = false;

    }


    sendBtn.addEventListener(
      "click",
      sendMessage
    );


    /*
      Enter दबाकर message भेजना
    */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );

  </script>

</body>
</html>
